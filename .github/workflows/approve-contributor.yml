name: Approve contributor

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: approve-contributor
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create contributor approval token
        id: bot-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AIDGET_BOT_CLIENT_ID }}
          private-key: ${{ secrets.AIDGET_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Update contributor allowlist
        id: approval
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node scripts/contributors/approval.mjs update

      - name: Commit allowlist update
        if: steps.approval.outputs.status == 'changed'
        run: |
          git config user.name "aidget-bot[bot]"
          git config user.email "${{ vars.AIDGET_BOT_APP_ID }}+aidget-bot[bot]@users.noreply.github.com"
          git add .github/APPROVED_CONTRIBUTORS
          git commit -m "chore: approve contributor from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment on issue
        if: steps.approval.outputs.status == 'changed'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          APPROVAL_STATUS: ${{ steps.approval.outputs.status }}
          APPROVAL_USERNAME: ${{ steps.approval.outputs.username }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/contributors/approval.mjs comment
